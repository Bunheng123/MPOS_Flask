<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — TechStore</title>

  <!-- Bootstrap Icons -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            ink: '#12151d',
            'ink-soft': '#1a1f2e',
            paper: '#f8fafc',
            card: '#ffffff',
            border: '#e2e8f0',
            text: '#0f172a',
            'text-muted': '#64748b',
            violet: '#6d5efc',
            'violet-hover': '#5b4df2',
            'violet-light': 'rgba(109,94,252,0.1)',
            teal: '#14b8a6',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-paper font-sans text-text antialiased min-h-screen flex flex-col justify-between selection:bg-violet selection:text-white">

  <!-- Background decorative glows -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-violet/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-teal/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Top bar with Back Link -->
  <header class="p-6 flex justify-between items-center max-w-6xl mx-auto w-full">
    <a href="{{ url_for('front_bp.home') }}" class="flex items-center gap-2 group">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-violet to-teal flex items-center justify-center shadow-md shadow-violet/20 group-hover:scale-105 transition-transform">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <line x1="8" y1="21" x2="16" y2="21" />
          <line x1="12" y1="17" x2="12" y2="21" />
        </svg>
      </div>
      <span class="font-display font-bold text-lg text-ink tracking-tight">TechStore</span>
    </a>

    <a href="{{ url_for('front_bp.home') }}" class="inline-flex items-center gap-2 text-xs font-semibold text-text-muted hover:text-ink transition-colors px-3 py-1.5 rounded-lg hover:bg-slate-200/50">
      <i class="bi bi-arrow-left"></i>
      <span>Back to Store</span>
    </a>
  </header>

  <!-- Main Register Card Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-[440px]">
      
      <!-- Card -->
      <div class="bg-card border border-border/80 shadow-xl shadow-slate-200/50 rounded-2xl p-7 sm:p-9 relative overflow-hidden backdrop-blur-sm">
        
        <!-- Top accent line -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-violet via-teal to-violet"></div>

        <!-- Header info -->
        <div class="mb-6 text-center">
          <div class="w-12 h-12 bg-violet-light text-violet rounded-xl flex items-center justify-center mx-auto mb-3 text-xl">
            <i class="bi bi-person-plus-fill"></i>
          </div>
          <h1 class="font-display text-2xl font-bold text-ink">Create an account</h1>
          <p class="text-xs text-text-muted mt-1">Get started with your TechStore account</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 text-xs font-medium flex items-center gap-2">
          <i class="bi bi-exclamation-circle-fill"></i>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Register Form -->
        <form action="{{ url_for('admin_bp.do_register') }}" method="POST" class="space-y-4" autocomplete="off">
          <!-- CSRF Token -->
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          
          <!-- Username field -->
          <div>
            <label for="username" class="block text-xs font-semibold text-text mb-1.5">
              Username
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-text-muted/70 text-sm">
                <i class="bi bi-person"></i>
              </span>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                required
                class="w-full pl-10 pr-4 py-2.5 bg-paper/60 border border-border rounded-xl text-sm text-text placeholder:text-text-muted/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-violet/20 focus:border-violet transition-all"
              />
            </div>
          </div>

          <!-- Email field -->
          <div>
            <label for="email" class="block text-xs font-semibold text-text mb-1.5">
              Email Address
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-text-muted/70 text-sm">
                <i class="bi bi-envelope"></i>
              </span>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="name@example.com"
                required
                class="w-full pl-10 pr-4 py-2.5 bg-paper/60 border border-border rounded-xl text-sm text-text placeholder:text-text-muted/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-violet/20 focus:border-violet transition-all"
              />
            </div>
          </div>

          <!-- Password field -->
          <div>
            <label for="password" class="block text-xs font-semibold text-text mb-1.5">
              Password
            </label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-text-muted/70 text-sm">
                <i class="bi bi-lock"></i>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
                class="w-full pl-10 pr-10 py-2.5 bg-paper/60 border border-border rounded-xl text-sm text-text placeholder:text-text-muted/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-violet/20 focus:border-violet transition-all"
              />
              <button
                type="button"
                id="togglePassword"
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-text-muted hover:text-text text-sm transition-colors"
                aria-label="Toggle password visibility"
              >
                <i class="bi bi-eye" id="toggleIcon"></i>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="w-full py-2.5 px-4 bg-violet hover:bg-violet-hover text-white text-sm font-semibold rounded-xl shadow-lg shadow-violet/25 hover:shadow-violet/35 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-150 flex items-center justify-center gap-2 mt-2"
          >
            <span>Create Account</span>
            <i class="bi bi-arrow-right text-xs"></i>
          </button>
        </form>

        <div class="mt-6 text-center text-xs text-text-muted">
          Already have an account?
          <a href="{{ url_for('admin_bp.login') }}" class="text-violet font-semibold hover:underline ml-1">Sign in</a>
        </div>

      </div>

    </div>
  </main>

  <!-- Bottom Copyright -->
  <footer class="py-4 text-center text-xs text-text-muted">
    &copy; TechStore. All rights reserved.
  </footer>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
      });
    }
  </script>
</body>
</html>
