{% extends 'admin/master.html' %}

{% block tab_title %}Add User{% endblock %}

{% block content %}

<div class=" w-full">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-2xl font-bold text-text">Add New User</h2>
            <p class="text-xs text-text-muted mt-1">
                Fill in the information below to create a new account.
            </p>
        </div>

        <a href="{{ url_for('admin_bp.user') }}"
           class="inline-flex items-center gap-2 border border-border px-4 py-2 rounded-lg text-xs font-semibold hover:bg-paper transition">
            <i class="bi bi-arrow-left"></i>
            Back
        </a>
    </div>

    <!-- Form -->
    <div class="bg-card border border-border rounded-2xl shadow-sm p-6">

        <form action="{{ url_for('admin_bp.add_user') }}" method="POST" enctype="multipart/form-data">

            <!-- Profile Image Section -->
            <div class="mb-6 pb-6 border-b border-border flex flex-col sm:flex-row items-center gap-5">
                <div class="relative">
                    <img id="profilePreview"
                         src=""
                         alt="Preview"
                         class="w-20 h-20 rounded-full object-cover border-2 border-violet shadow-md hidden" />
                    <div id="defaultAvatarIcon" class="w-20 h-20 rounded-full bg-violet-light border-2 border-dashed border-violet flex items-center justify-center text-violet text-3xl">
                        <i class="bi bi-person-fill"></i>
                    </div>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-text">Profile Picture</label>
                    <p class="text-[10px] text-text-muted mb-2">JPG, JPEG or PNG. Max size 2MB.</p>
                    <div class="flex items-center gap-3">
                        <label class="inline-flex items-center justify-center gap-2 border border-border bg-card hover:bg-paper text-text font-semibold text-xs py-2 px-3 rounded-lg transition-colors cursor-pointer w-fit">
                            <i class="bi bi-upload"></i>
                            <span id="uploadButtonText">Choose File</span>
                            <input type="file" id="profileImageInput" name="profile_image" accept="image/*" class="hidden">
                        </label>
                        <span id="fileNameDisplay" class="text-xs text-text-muted hidden truncate max-w-[200px]"></span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


                <!-- Username -->
                <div>
                    <label class="block text-xs font-semibold text-text mb-2">
                        Username
                    </label>
                    <input
                        type="text"
                        name="username"
                        placeholder="johndoe"
                        required
                        class="w-full rounded-lg border border-border bg-paper px-4 py-3 text-sm outline-none focus:border-violet">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-xs font-semibold text-text mb-2">
                        Email
                    </label>
                    <input
                        type="email"
                        name="email"
                        placeholder="john@email.com"
                        required
                        class="w-full rounded-lg border border-border bg-paper px-4 py-3 text-sm outline-none focus:border-violet">
                </div>


                <!-- Password -->
                <div>
                    <label class="block text-xs font-semibold text-text mb-2">
                        Password
                    </label>
                    <input
                        type="password"
                        name="password"
                        required
                        class="w-full rounded-lg border border-border bg-paper px-4 py-3 text-sm outline-none focus:border-violet">
                </div>


                <!-- Role -->
                <div>
                    <label class="block text-xs font-semibold text-text mb-2">
                        Role
                    </label>

                    <select
                        name="role"
                        class="w-full rounded-lg border border-border bg-paper px-4 py-3 text-sm outline-none focus:border-violet">

                        <option class="uppercase" value="user">USER</option>
                        <option class="uppercase" value="admin">ADMIN</option>

                    </select>
                </div>



            <!-- Buttons -->
            <div class="flex justify-end gap-3 mt-8">

                <a href="{{ url_for('admin_bp.user') }}"
                   class="px-5 py-3 rounded-lg border border-border font-semibold text-sm hover:bg-paper transition">
                    Cancel
                </a>

                <button
                    type="submit"
                    class="inline-flex items-center gap-2 bg-violet hover:bg-[#5b4de8] text-white px-5 py-3 rounded-lg font-semibold text-sm transition">

                    <i class="bi bi-person-plus-fill"></i>
                    Create User

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
