      <i

    <a

      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-text-invert hover:bg-white/5 hover:text-white transition-all duration-150 relative group {% if module in ['user', 'user_add', 'user_edit', 'user_delete'] or request.endpoint in ['user', 'add_user', 'edit_user', 'confirm_delete_user', 'admin_bp.user', 'admin_bp.add_user', 'admin_bp.edit_user', 'admin_bp.confirm_delete_user'] %}bg-violet-light text-white before:content-[''] before:absolute before:left-0 before:top-2 before:bottom-2 before:w-[3px] before:bg-violet before:rounded-r{% endif %}"

        class="bi bi-people-fill text-base shrink-0 transition-colors {% if module in ['user', 'user_add', 'user_edit', 'user_delete'] or request.endpoint in ['user', 'add_user', 'edit_user', 'confirm_delete_user', 'admin_bp.user', 'admin_bp.add_user', 'admin_bp.edit_user', 'admin_bp.confirm_delete_user'] %}text-violet{% else %}text-white/40 group-hover:text-white/70{% endif %}"

      <i
        class="bi bi-box-seam-fill text-base shrink-0 text-white/40 group-hover:text-white/70 transition-colors"

      <div class="h-[5px] rounded-full bg-white/5 overflow-hidden">

      </div>
    </div>
    <div
      class="sidebar-admin-chip flex items-center gap-2.5 p-2.5 rounded-xl bg-white/[0.03] border border-white/5"

        <small class="text-[10px] text-white/40 truncate"
