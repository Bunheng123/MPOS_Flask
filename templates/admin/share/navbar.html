<!-- Search -->
<div
  class="flex-1 max-w-[400px] flex items-center gap-2 bg-paper border border-border rounded-full px-4 py-2 text-text-muted focus-within:border-violet focus-within:ring-2 focus-within:ring-violet-light transition-all hidden md:flex"
>
  <i class="bi bi-search text-xs"></i>
  <input
    type="text"
    placeholder="Search records, users, orders…"
    id="topbarSearch"
    class="border-none bg-transparent outline-none w-full text-xs text-text"
  />
</div>

<!-- Actions -->
<div class="ml-auto flex items-center gap-2">
  <button
    class="relative border border-border bg-card hover:bg-paper w-[38px] h-[38px] rounded-lg flex items-center justify-center text-text-muted hover:text-text transition-colors"
    aria-label="Notifications"
    id="navNotifBtn"
  >
    <i class="bi bi-bell-fill"></i>
    <span
      class="absolute top-1.5 right-1.5 w-[7px] h-[7px] rounded-full bg-rose border border-card"
    ></span>
  </button>
  <button
    class="border border-border bg-card hover:bg-paper w-[38px] h-[38px] rounded-lg flex items-center justify-center text-text-muted hover:text-text transition-colors"
    aria-label="Messages"
    id="navMsgBtn"
  >
    <i class="bi bi-chat-dots-fill"></i>
  </button>
  <div class="w-[1px] h-6 bg-border mx-1"></div>

  <!-- User Profile Dropdown -->
  <div class="relative" id="userDropdownWrapper">
    <button
      class="flex items-center gap-2.5 border border-border bg-card hover:bg-paper rounded-full py-1 pl-1 pr-3 transition-colors shrink-0"
      id="navUserChip"
    >
      <img
        src="{{ url_for('static', filename=session.get('profile_image', 'images/no-image.jpg') or 'images/no-image.jpg') }}"
        alt="{{ session.get('username') }}"
        class="w-8 h-8 rounded-full object-cover bg-gradient-to-br from-violet to-teal text-white flex items-center justify-center text-[11px] font-bold shrink-0"
      />
      <span
        class="flex flex-col text-left leading-tight shrink-0 hidden sm:flex"
      >
        <strong class="text-xs font-semibold text-text"
          >{{ session.get('username', 'Admin') }}</strong
        >
        <small class="text-[10px] text-text-muted"
          ><i class="bi bi-person-badge"></i> {{ session.get('user_role') or session.get('role', 'admin')
          }}</small
        >
      </span>
      <i class="bi bi-chevron-down text-text-muted text-[10px]"></i>
    </button>
    <ul
      class="absolute right-0 mt-2 w-48 bg-card border border-border rounded-xl shadow-lg py-1.5 z-50 hidden"
      id="navUserDropdown"
    >
      <li>
        <a
          class="flex items-center px-4 py-2 text-xs font-medium text-text hover:bg-paper transition-colors"
          href="{{ url_for('admin_bp.edit_user', user_id=session.get('user_id')) if session.get('user_id') else '#' }}"
        >
          <i class="bi bi-person me-2 text-text-muted text-sm"></i>Profile
        </a>
      </li>
      <li>
        <a
          class="flex items-center px-4 py-2 text-xs font-medium text-text hover:bg-paper transition-colors"
          href="#"
        >
          <i class="bi bi-gear me-2 text-text-muted text-sm"></i>Settings
        </a>
      </li>
      <li><hr class="border-t border-border my-1" /></li>
      <li>
        <a
          class="flex items-center px-4 py-2 text-xs font-medium text-rose hover:bg-rose/5 transition-colors"
          href="{{ url_for('admin_bp.logout') }}"
        >
          <i class="bi bi-box-arrow-right me-2 text-rose text-sm"></i>Sign out
        </a>
      </li>
    </ul>
  </div>
</div>
