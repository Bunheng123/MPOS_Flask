<!-- Navbar -->
<nav id="mainNav" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" style="background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

    <!-- Logo -->
    <a href="{{ url_for('front_bp.home') }}" class="flex items-center gap-2 group">
      <div style="width:34px;height:34px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(59,130,246,0.4);transition:all 0.3s;" class="nav-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </div>
      <h1 style="font-size:1.25rem;font-weight:800;background:linear-gradient(90deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px;">TechStore</h1>
    </a>

    <!-- Nav Links -->
    <div class="flex items-center gap-1">
      <a href="{{ url_for('front_bp.home') }}" class="nav-link" id="nav-home">Home</a>
      <a href="{{ url_for('front_bp.products') }}" class="nav-link" id="nav-products">Products</a>
      <a href="{{ url_for('front_bp.cart') }}" class="nav-link nav-cart-link" id="nav-cart" style="position:relative;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:5px;margin-top:-2px;">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        Cart
        {% if cart_count and cart_count > 0 %}
        <span style="position:absolute;top:-6px;right:-8px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:white;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 10px rgba(59,130,246,0.6);">
          {{ cart_count }}
        </span>
        {% endif %}
      </a>
    </div>

  </div>
</nav>

<!-- Spacer so content doesn't hide behind fixed nav -->
<div style="height:72px;"></div>

<style>
  .nav-link {
    color: #94a3b8;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 10px;
    text-decoration: none;
    transition: all 0.25s ease;
    position: relative;
    letter-spacing: 0.01em;
  }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    border-radius: 99px;
    transition: width 0.3s ease;
  }
  .nav-link:hover {
    color: #ffffff;
    background: rgba(255,255,255,0.06);
  }
  .nav-link:hover::after {
    width: 60%;
  }
  .nav-link.active {
    color: #ffffff;
    background: rgba(59,130,246,0.12);
  }
  .nav-link.active::after {
    width: 60%;
  }
  .nav-logo-icon:hover {
    box-shadow: 0 0 30px rgba(59,130,246,0.7) !important;
    transform: rotate(-5deg) scale(1.05);
  }
  /* Scrolled state */
  #mainNav.scrolled {
    background: rgba(2, 6, 23, 0.95) !important;
    border-bottom-color: rgba(59,130,246,0.15) !important;
    box-shadow: 0 4px 30px rgba(0,0,0,0.4);
  }
</style>

<script>
  // Active link detection
  (function() {
    const path = window.location.pathname;
    if (path === '/' || path.includes('home')) document.getElementById('nav-home').classList.add('active');
    else if (path.includes('products') || path.includes('product')) document.getElementById('nav-products').classList.add('active');
    else if (path.includes('cart')) document.getElementById('nav-cart').classList.add('active');
  })();

  // Scroll effect
  window.addEventListener('scroll', function() {
    const nav = document.getElementById('mainNav');
    if (window.scrollY > 20) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  });
</script>
